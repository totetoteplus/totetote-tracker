<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とてとてtracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --board:#151a2e;
    --board-deep:#0d1120;
    --panel:#1c2340;
    --ticket:#f4ead2;
    --ticket-shadow:#d8cba8;
    --amber:#e8a33d;
    --amber-deep:#c97f1f;
    --ink:#f4ead2;
    --ink-dim:#9aa3c4;
    --line:#31396a;
    --ok:#2f8f4e;
    --ok-deep:#1f5f34;
    --open-blue:#156bb0;
    --warn:#c97f1f;
    --closed:#4a4f6e;
    --unknown:#3c4470;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--board-deep);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(95,184,122,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(232,163,61,0.05), transparent 40%);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .app{max-width:1180px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  .topband{
    padding:22px 28px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:1px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    font-size:21px;
    letter-spacing:.04em;
    color:var(--ticket);
  }
  .brand .plus{color:var(--amber);}
  .brand .tracker{
    margin-left:8px;
    font-weight:500;
    font-size:12px;
    letter-spacing:.22em;
    color:var(--ink-dim);
  }
  .updated{font-size:12px; color:var(--ink-dim); letter-spacing:.03em;}

  .notice{
    margin:14px 28px 0;
    background:rgba(232,163,61,0.08);
    border:1px dashed var(--amber-deep);
    border-radius:8px;
    padding:12px 16px;
    font-size:12px;
    line-height:1.8;
    color:var(--ink-dim);
  }
  .notice b{color:var(--amber);}

  .toolbar{
    padding:16px 28px 6px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .cat-chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    padding:6px 12px;
    border-radius:16px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-dim);
    font-size:12px;
    cursor:pointer;
    transition:.15s ease;
  }
  .chip:hover{color:var(--ticket);}
  .chip.active{background:rgba(232,163,61,0.15); border-color:var(--amber-deep); color:var(--amber);}

  .result-count{
    margin-left:auto;
    font-size:11.5px;
    color:var(--ink-dim);
  }

  .panel{padding:10px 28px 60px;}

  .tickets{display:flex; flex-direction:column; gap:6px;}
  .ticket-wrap{display:flex; flex-direction:column; gap:0;}

  .ticket{
    display:flex;
    align-items:stretch;
    background:var(--ticket);
    color:#241d0f;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
    position:relative;
  }
  .ticket::before{
    content:"";
    position:absolute;
    left:96px;
    top:0; bottom:0;
    width:0;
    border-left:2px dashed var(--ticket-shadow);
  }
  .ticket .stub{
    width:96px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5px 6px;
    text-align:center;
  }
  .stub.status-open{background:var(--open-blue); color:#eaf2ff;}
  .stub.status-soon{background:var(--warn); color:#2c1c04;}
  .stub.status-closed{background:var(--closed); color:#c7cce6;}
  .stub.status-unknown{background:var(--unknown); color:#c7cce6;}

  .stub .status-value{font-family:'Shippori Mincho', serif; font-weight:700; font-size:13px; line-height:1.25;}

  .ticket .info{
    padding:7px 16px 7px 20px;
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    column-gap:16px;
    row-gap:2px;
  }
  .ticket .tname{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:13.5px;
    line-height:1.3;
    flex-basis:100%;
  }
  .badges{display:flex; gap:5px; flex-wrap:wrap; align-items:center;}
  .badge{
    font-size:9.5px;
    padding:1px 8px;
    border-radius:11px;
    font-weight:700;
    white-space:nowrap;
  }
  .badge.cat{background:#e4d9b8; color:#4a3f28;}
  .badge.date{background:#dfe6f5; color:#2c3d63;}
  .badge.conf-high{background:#d4ecd9; color:#1f5f34;}
  .badge.conf-mid{background:#f3e3c2; color:#8a5a12;}
  .badge.conf-low{background:#ecd4d4; color:#7a3030;}

  .ticket .meta{
    display:flex;
    flex-wrap:wrap;
    gap:3px 14px;
    font-size:11px;
    color:#4a3f28;
  }
  .ticket .meta b{color:#241d0f;}
  .links{display:flex; gap:12px; flex-wrap:wrap;}
  .ticket .src{
    display:inline-block;
    font-size:10.5px;
    color:#7a5b1a;
    text-decoration:none;
    border-bottom:1px solid #c9a35c;
    white-space:nowrap;
  }
  .ticket .src:hover{color:#4a3f28;}
  .ticket .src.lottery{color:#1f5f34; border-bottom-color:#5fb87a; font-weight:700;}
  .ticket .src.lottery:hover{color:#173a1f;}
  .ticket .note{font-size:10.5px; color:#6b5a2e; flex-basis:100%;}


  .empty{
    color:var(--ink-dim);
    font-size:13px;
    padding:40px 0;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:10px;
  }

  .ad-section{
    padding:24px 28px 30px;
    text-align:center;
    border-top:1px solid var(--line);
  }
  .ad-label{
    font-size:10px;
    color:var(--ink-dim);
    letter-spacing:.05em;
    margin-bottom:10px;
  }
  .ad-section img{max-width:100%; height:auto;}

  @media (max-width:720px){
    .toolbar{padding:12px 16px 4px;}
    .panel{padding:10px 16px 40px;}
    .notice{margin:12px 16px 0;}
    .ticket{flex-direction:column;}
    .ticket .stub{width:100%; flex-direction:row; padding:6px 14px; gap:8px; justify-content:flex-start;}
    .ticket::before{display:none;}
    .ad-section{padding:18px 16px 24px;}
  }
</style>
</head>

  {key:"pokemon", label:"ポケモンカード", icon:"🔴"},
  {key:"yugioh", label:"遊戯王カード", icon:"🟣"},
  {key:"onepiece", label:"ワンピースカード", icon:"🟡"},
  {key:"dragonball", label:"ドラゴンボールカード", icon:"🟠"},
  {key:"beyblade", label:"ベイブレード", icon:"🔵"},
  {key:"watch", label:"腕時計", icon:"⚫"},
  {key:"nike", label:"Nike", icon:"⚪"},
  {key:"ichibankuji", label:"一番くじ", icon:"🟢"},
  {key:"chiikawa", label:"ちいかわ", icon:"🟤"},
  {key:"livepocket", label:"LivePocket", icon:"🔘"}
];

let activeCats = new Set();
const UNKNOWN_TEXT = "未定（抽選ページでご確認ください）";

function fmtYen(n){ return "¥" + n.toLocaleString("ja-JP"); }

function confBadgeClass(status){
  if(status==="confirmed") return "conf-high";
  if(status==="reference") return "conf-mid";
  return "conf-low";
}

const STALE_DAYS = 7;
function isStale(item){
  if(item.status !== "closed" || !item.closedOn) return false;
  const closedDate = new Date(item.closedOn + "T00:00:00");
  const diffDays = (Date.now() - closedDate.getTime()) / 86400000;
  return diffDays >= STALE_DAYS;
}

function sortRank(item){
  // 1:受付中(期限の近い順) 2:受付中あり 3:受付前(開始日の近い順) 4:受付終了 5:その他(要確認)
  if(item.status === "open"){
    return item.statusText === "受付中あり" ? 2 : 1;
  }
  if(item.status === "soon") return 3;
  if(item.status === "closed") return 4;
  return 5;
}

function fmtDateBadge(periodStart){
  if(!periodStart) return "随時／日付未定";
  const d = new Date(periodStart + "T00:00:00");
  return `開始 ${d.getMonth()+1}/${d.getDate()}`;
}

function renderChips(){
  const chipsEl = document.getElementById("chips");
  chipsEl.innerHTML = "";
  const allBtn = document.createElement("button");
  allBtn.className = "chip" + (activeCats.size===0 ? " active" : "");
  allBtn.textContent = "全体表示";
  allBtn.onclick = ()=>{
    activeCats.clear();
    render();
  };
  chipsEl.appendChild(allBtn);
  CATEGORIES.forEach(c=>{
    const btn = document.createElement("button");
    btn.className = "chip" + (activeCats.has(c.key) ? " active" : "");
    btn.textContent = `${c.icon} ${c.label}`;
    btn.onclick = ()=>{
      if(activeCats.has(c.key)) activeCats.delete(c.key); else activeCats.add(c.key);
      render();
    };
    chipsEl.appendChild(btn);
  });
}

function render(){
  renderChips();
  const panel = document.getElementById("panel");

  let items = ITEMS.filter(i=>!isStale(i));
  if(activeCats.size>0) items = items.filter(i=>activeCats.has(i.category));

  items.sort((a,b)=>{
    const ra = sortRank(a), rb = sortRank(b);
    if(ra !== rb) return ra - rb;
    if(ra === 1){
      const da = a.deadline ? new Date(a.deadline).getTime() : Infinity;
      const db = b.deadline ? new Date(b.deadline).getTime() : Infinity;
      return da - db;
    }
    if(ra === 3 || ra === 4 || ra === 5){
      const ta = a.periodStart ? new Date(a.periodStart).getTime() : Infinity;
      const tb = b.periodStart ? new Date(b.periodStart).getTime() : Infinity;
      return ta - tb;
    }
    return 0;
  });

  document.getElementById("count").textContent = `${items.length}件`;

  let html;
  if(items.length===0){
    html = `<div class="empty">該当する商品はありません。</div>`;
  } else {
    html = `<div class="tickets">`;
    items.forEach(it=>{
      const pr = (it.resaleLow!=null && it.resaleHigh!=null) ? {lo:it.resaleLow-it.lotteryPrice, hi:it.resaleHigh-it.lotteryPrice} : null;
      html += `
        <div class="ticket-wrap">
          <div class="ticket">
            <div class="stub status-${it.status}">
              <div class="status-value">${it.statusText}</div>
            </div>
            <div class="info">
              <div class="tname">${it.name}</div>
              <div class="badges">
                <span class="badge date">🗓 ${fmtDateBadge(it.periodStart)}</span>
                <span class="badge cat">${it.icon} ${it.categoryLabel}</span>
                <span class="badge ${confBadgeClass(it.dataStatus)}">確度：${it.confidence}</span>
              </div>
              <div class="meta">
                <span><b>販売元：</b>${it.store}</span>
                <span><b>期間：</b>${it.period}</span>
                <span><b>抽選価格：</b>${fmtYen(it.lotteryPrice)}</span>
                ${pr ? `<span><b>転売相場：</b>${it.resaleLow===it.resaleHigh ? fmtYen(it.resaleLow) : fmtYen(it.resaleLow)+"〜"+fmtYen(it.resaleHigh)}</span>` : ""}
              </div>
              ${it.note ? `<div class="note">※ ${it.note}</div>` : ""}
              <div class="links">
                <a class="src lottery" href="${it.lotteryUrl}" target="_blank" rel="noopener">抽選ページを開く ↗</a>
                ${it.sourceUrl ? `<a class="src" href="${it.sourceUrl}" target="_blank" rel="noopener">価格情報ソース ↗</a>` : ""}
              </div>
            </div>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }

  panel.innerHTML = html;
}

render();
