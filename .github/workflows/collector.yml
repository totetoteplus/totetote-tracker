name: Collector - run due jobs

# 毎日6:00 / 18:00 (JST) 前後に起動し、scheduler/run_due.py が
# scheduler/config.yaml のスケジュールとDB(collector_runs)の直近実行時刻を見て
# 実行すべきCollectorだけを動かす。
#
# cron時刻はUTC表記: 21:00 UTC = 06:00 JST(翌日) / 09:00 UTC = 18:00 JST(同日)
# GitHub Actionsの scheduled workflowは高負荷時に50分〜1時間以上遅延することが
# 実測で確認されているため、run_due.py側では上限付きの許容ウィンドウ方式を
# 使わず「予定時刻を過ぎていて、かつ未実行なら実行する」方式にしている
# (scheduler/run_due.py参照)。
#
# concurrency: 手動実行(workflow_dispatch)とスケジュール実行が近い時刻に重なると
# 同時に2つ動いてしまい、二重にAPIを叩いてしまう(実際に発生を確認済み)。
# 同時実行を1つに制限し、後から来た方はキューイングして順番に実行させる。
on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: collector-run-due
  cancel-in-progress: false

jobs:
  run-due-collectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scheduler/run_due.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}

      # pending候補をAI補助抽出でproducts/lotteriesへ構造化・昇格する。
      # 1回の実行あたりの上限を設け、API呼び出しが際限なく膨らまないようにする。
      - run: python scripts/promote_candidates.py 200
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 応募開始/終了日時が判明しているlotteriesは、時間経過だけで
      # soon -> open -> closed と状態が変わりうるため毎回statusを再計算する。
      - run: python scripts/refresh_lottery_status.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
