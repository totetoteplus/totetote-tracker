# X(Twitter)監視アカウント一覧。twitterapi.io経由で取得する（Phase 2）。
#
# tier:
#   confirmed      -> カテゴリ確定済みの公式/準公式アカウント。
#                     通常のCollector出力として扱ってよい。
#   auto_judgment  -> 自動取得はするが、公式リンク・カテゴリの確認が
#                     済むまで公開（products/listings/lotteriesへの反映）を保留する。
#                     CollectedItem.needs_manual_review = true として扱う。
#
# category は既存トラッカーのカテゴリキーに合わせる:
#   pokemon / yugioh / onepiece / dragonball / beyblade / watch / nike /
#   ichibankuji / chiikawa / livepocket
# auto_judgment はカテゴリ横断・非公式/二次情報源の可能性があるため category: null
#
# official_multi_category: true
#   auto_judgment のうち、情報源自体は公式ショップ等の一次情報だが
#   複数カテゴリを横断するため category を固定できないアカウント用。
#   AI補助抽出でツイート単位の category が判定できた候補に限り自動昇格を許可する
#   （二次情報・まとめ/転売系アカウントには付けないこと）。
#
# shop_name_required: true
#   auto_judgment のうち、対象カテゴリ(単一ゲーム)は確定しているが、
#   アカウント自身は実施店舗ではない「まとめ/情報アカウント」用。
#   このアカウント自身の表示名をshops.nameとして使うと実在しない店舗を
#   捏造することになるため、ツイート本文から実施店舗名がAI抽出できた
#   候補に限り自動昇格を許可する（店舗名が特定できない投稿はneeds_reviewのまま）。

